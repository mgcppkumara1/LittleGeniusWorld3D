name: Get Unity License (.alf)

# Run this ONCE to get your Unity license file.
# After that, use build-android.yml to build the APK.

on:
  workflow_dispatch: {}   # Manual trigger only

jobs:
  activation:
    name: Request Unity License
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Request activation file (.alf)
        id: getManualLicenseFile
        uses: game-ci/unity-activate@v2

      - name: Upload .alf file (download from Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: unity-license-alf
          path: ${{ steps.getManualLicenseFile.outputs.filePath }}
