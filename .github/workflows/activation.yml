name: Get Unity License (.alf)

on:
  workflow_dispatch: {}

jobs:
  activation:
    name: Request Unity License
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Use unity-request-activation-file which doesn't need Docker
      - name: Request activation file (.alf)
        uses: game-ci/unity-request-activation-file@v2
        id: getManualLicenseFile

      - name: Upload .alf file
        uses: actions/upload-artifact@v4
        with:
          name: unity-license-activation-file
          path: ${{ steps.getManualLicenseFile.outputs.filePath }}
          retention-days: 5
