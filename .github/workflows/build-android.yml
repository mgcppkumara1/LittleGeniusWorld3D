name: Build Android APK

on:
  workflow_dispatch: {}          # Manual trigger
  push:
    branches: [main]             # Auto-build on every push to main

jobs:
  build:
    name: Build for Android
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false

      # ── 2. Cache Library folder (speeds up repeat builds) ────────
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-
            Library-

      # ── 3. Build with GameCI ─────────────────────────────────────
      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:   ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.0.0f1
          targetPlatform: Android
          androidExportType: androidPackage      # outputs .apk
          androidKeystoreName: ""               # debug-signed (no keystore needed)
          buildMethod: LGWBuild.BuildApk
          buildsPath: Builds

      # ── 4. Upload APK as downloadable Artifact ───────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LittleGeniusWorld3D-APK
          path: Builds/**/*.apk
          retention-days: 30
